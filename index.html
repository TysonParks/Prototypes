<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prototypes</title>

  <link rel="stylesheet" type="text/css" href="style.css">

  <script>
    window._unsupported = !/Chrome/.test(navigator.userAgent);
    if (window._unsupported) {
      document.documentElement.classList.add('unsupported-browser');
    } else {
      document.write('<script src="libraries/p5.min.js"><\/script>');
    }
  </script>
</head>

<body>
  <div id="unsupported-msg">
    <p>The Prototypes live generator preview is currently supported in Chrome and Edge on desktop.</p>
    <p>Please open this page in Chrome or Edge on a desktop computer to explore the system.</p>
  </div>
  <script>
    if (window._unsupported) {
      document.getElementById('unsupported-msg').style.display = 'flex';
    } else {
      document.getElementById('unsupported-msg').remove();
      var scripts = [
        'gui.js', 'RandomExtended.js', 'Features.js',
        'artBlocks/ABFeaturesScript.js', 'artBlocks/tokenHash.js', 'artBlocks/Random.js',
        'OpArray.js', 'color.js', 'drawAsSVG.js',
        'ProtoStore.js', 'DeBugging.js', 'Animation.js',
        'ProtoUtility.js', 'ProtoLayerObjects.js', 'Grid.js',
        'ProtoFilter.js', 'oklch2rgb.js', 'neuMark_I.js', 'squircle.js',
        'ProtoBatch.js', 'PublicGenerator.js', 'sketch.js'
      ];
      scripts.forEach(function (s) {
        document.write('<script src="' + s + '"><\/script>');
      });
    }
  </script>
</body>

</html>
